<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Condo Notice Board</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f4f6;color:#374151;}
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px;}
  .logo{font-size:40px;line-height:1;display:inline-block;padding:6px;cursor:default;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  h1{font-size:1.4rem;margin:12px 0 4px;}
  .sub{color:#6b7280;margin:0 0 24px;}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px 20px;margin-bottom:14px;}
  .card h2{font-size:1rem;margin:0 0 6px;}
  .card p{margin:0;font-size:.95rem;line-height:1.5;}
  footer{color:#9ca3af;font-size:.8rem;margin-top:28px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <span class="logo" id="logo" aria-hidden="true">🏢</span>
  <h1>Condo Notice Board</h1>
  <p class="sub">Under maintenance</p>
  <div class="card">
    <h2>Scheduled maintenance</h2>
    <p>The resident notice board is currently being updated. Please check back later.</p>
  </div>
  <div class="card">
    <h2>Reminder</h2>
    <p>For urgent building matters, please contact the management office during office hours.</p>
  </div>
  <footer>&copy; Building Management</footer>
</div>
<script>
(function(){
  var el=document.getElementById('logo'),taps=[];
  el.addEventListener('click',function(){
    var now=Date.now();
    taps.push(now);
    taps=taps.filter(function(t){return now-t<=3000;});
    if(taps.length>=5){taps=[];window.location.href='room-7f3k9q/';}
  });
})();
</script>
</body>
</html>
